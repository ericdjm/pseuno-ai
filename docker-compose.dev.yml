services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pseuno
      POSTGRES_PASSWORD: pseuno
      POSTGRES_DB: pseuno
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pseuno -d pseuno"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/.env
    environment:
      # Docker-specific overrides (override .env values for containerized environment)
      FRONTEND_ORIGIN: http://127.0.0.1:5173
      DATABASE_URL: postgresql+psycopg://pseuno:pseuno@postgres:5432/pseuno
      REDIS_URL: redis://redis:6379/0
      # PostHog (backend telemetry: LLM call timings + repair agent)
      POSTHOG_API_KEY: phc_QSa2Ckp3pGSJvQVSKo7WZ46mVzlkyQkfJbO0afgPxkE
      POSTHOG_HOST: https://us.i.posthog.com
      APP_ENV: dev
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_BASE: http://127.0.0.1:8000
      CHOKIDAR_USEPOLLING: "true"
      # PostHog (frontend analytics)
      VITE_POSTHOG_KEY: phc_QSa2Ckp3pGSJvQVSKo7WZ46mVzlkyQkfJbO0afgPxkE
      VITE_POSTHOG_HOST: https://us.i.posthog.com
      VITE_APP_ENV: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
